<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Videogames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Sarpanch:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="fixed-top">
        <nav class="navbar navbar-expand-lg navbar-dark site-navbar shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="#inicio">
                    <img src="assets/logo.png" alt="" class="brand-logo">
                    Vector
                </a>
                <div class="d-flex align-items-center header-actions order-lg-last">
                    <div class="position-relative">
                        <button type="button" class="btn cart-toggle border-0 position-relative" aria-label="Carrito, 0 artículos" aria-expanded="false" aria-controls="cart-panel">
                            <i class="bi bi-cart3" aria-hidden="true"></i>
                            <span class="cart-badge position-absolute top-0 start-100 translate-middle badge rounded-circle" hidden>0</span>
                        </button>
                        <div id="cart-panel" class="cart-panel" role="dialog" aria-label="Carrito">
                            <h2 class="h6">Carrito</h2>
                            <div class="cart-items"></div>
                            <div class="cart-summary border-top border-secondary">
                                <div class="d-flex justify-content-between small">
                                    <span class="text-white-50">Subtotal</span>
                                    <span data-cart-subtotal>CLP$ 0</span>
                                </div>
                                <div class="d-flex justify-content-between small">
                                    <span class="text-white-50">IVA (19%)</span>
                                    <span data-cart-iva>CLP$ 0</span>
                                </div>
                                <div class="total-row d-flex justify-content-between fw-semibold">
                                    <span>Total</span>
                                    <span data-cart-total>CLP$ 0</span>
                                </div>
                                <form class="cart-checkout" novalidate>
                                    <label class="cart-checkout-label" for="cart-email">Correo</label>
                                    <input id="cart-email" class="cart-checkout-email" type="email" name="email" autocomplete="email" placeholder="tucorreo@mail.com">
                                    <p class="cart-checkout-msg" hidden></p>
                                    <button type="submit" class="btn btn-pay w-100" disabled>Ir a pagar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#inicio">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#ofertas">Ofertas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#productos">Productos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section id="inicio" aria-label="hero">
            <div id="carouselExampleIndicators" class="carousel slide hero-carousel">
                <div class="carousel-indicators"></div>
                <div class="carousel-inner"></div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
        <section id="ofertas" class="deals section" aria-labelledby="deals-heading">
            <div class="container-fluid">
                <h2 id="deals-heading" class="h4 section-title">Ofertas y descuentos</h2>
                <div class="row deals-grid"></div>
            </div>
        </section>
        <section id="productos" class="products section" aria-labelledby="products-heading">
            <div class="container-fluid">
                <h2 id="products-heading" class="h4 section-title">Productos</h2>
                <div class="row row-cols-2 row-cols-lg-4 row-cols-xxl-5 products-grid"></div>
                <nav class="products-pagination" aria-label="Paginación de productos">
                    <ul class="pagination justify-content-center"></ul>
                </nav>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container-fluid">
            <div class="footer-row d-flex flex-column flex-md-row align-items-center justify-content-between">
                <a class="footer-brand d-flex align-items-center text-white text-decoration-none fw-semibold" href="#inicio">
                    <img src="assets/logo.png" alt="" class="brand-logo">
                    Vector
                </a>
                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#inicio">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#ofertas">Ofertas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#productos">Productos</a>
                    </li>
                </ul>
                <p class="small text-white-50">© 2026 Vector Videogames</p>
            </div>
        </div>
    </footer>

    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
